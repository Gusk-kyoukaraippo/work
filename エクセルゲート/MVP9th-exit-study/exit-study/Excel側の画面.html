<main><h1>Excelでも、今押すボタンを同じ場所に</h1>
<p>説明のすぐ下に、大きな主ボタンを一つ置きました。「編集する」から「保存して閉じる」、保存の再試行まで、同じ位置で切り替わります。補助操作は淡い色で下にあります。</p>
<figure class="screen"><img src="画面/Excel-保存準備.png" alt="Excelで保存する内容を受け取った場面。説明のすぐ下に大きな緑の保存して閉じるボタンがある"></figure>
<p class="note">Mac版Excelで実際のVBAによって表示した画面です。確認用の設定と作業状態を与えています。受け取り処理・Windows / JUST Calcでの実行を実証する画像ではありません。</p>
<p>「設定を見直す」から、保存済みデータと履歴を残して置き場所などを登録し直せます。初回設定後も何度でも使えます。作業中や保存途中は、設定の変更を止めます。</p>
