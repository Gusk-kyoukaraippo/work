<title>ALBO 配車支援 MVP 2nd</title>
<style>
:root {
  color-scheme: light;
  --ink: #1f2933;
  --muted: #64748b;
  --line: #d8dee8;
  --panel: #ffffff;
  --bg: #f6f7f9;
  --accent: #0f766e;
  --warn: #b45309;
  --bad: #b91c1c;
  --good: #047857;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
header { padding: 18px 24px; border-bottom: 1px solid var(--line); background: #fff; }
h1 { margin: 0; font-size: 22px; letter-spacing: 0; }
main { display: grid; grid-template-columns: minmax(420px, 1fr) 420px; gap: 16px; padding: 16px; min-height: calc(100vh - 66px); }
section, aside { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px; border-bottom: 1px solid var(--line); }
button, .file-label { min-height: 38px; border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
button.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
input[type=text] { min-height: 38px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font-size: 14px; }
select { min-height: 34px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 13px; background: #fff; }
input[type=file] { display: none; }
.file-label { display: inline-flex; align-items: center; }
.zoom-controls { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 6px; padding: 3px; background: #f8fafc; }
.zoom-controls button { min-width: 34px; min-height: 30px; padding: 4px 8px; }
.zoom-controls .zoom-reset { min-width: 52px; }
#zoomLevel { min-width: 52px; text-align: center; color: var(--muted); font-size: 13px; }
.map-wrap { position: relative; min-height: 620px; overflow: hidden; background: #eef2f7; cursor: grab; touch-action: none; user-select: none; }
.map-wrap.is-panning { cursor: grabbing; }
body.drop-active .map-wrap { outline: 3px solid var(--accent); outline-offset: -6px; }
.map-zoom-surface { position: relative; width: 100%; min-height: 620px; height: 100%; overflow: hidden; }
.map-stage { --pin-scale: 1; --label-scale: 1; position: absolute; left: 0; top: 0; width: 1200px; height: 820px; margin: 0; transform-origin: top left; border: 1px solid #cbd5e1; background: linear-gradient(#fff, #fff), repeating-linear-gradient(0deg, transparent, transparent 39px, #dbe4ef 40px), repeating-linear-gradient(90deg, transparent, transparent 39px, #dbe4ef 40px); background-blend-mode: normal; }
.map-stage.has-image { width: max-content; height: max-content; background: transparent; }
#mapImage { display: none; max-width: none; pointer-events: none; user-select: none; -webkit-user-drag: none; }
.map-stage.has-image #mapImage { display: block; }
.placeholder { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 24px; }
.map-stage.has-image .placeholder { display: none; }
.connection-layer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 5; }
.connection-line { stroke-width: 4; stroke-linecap: round; opacity: .86; vector-effect: non-scaling-stroke; }
.pin { position: absolute; z-index: 10; transform: translate(-50%, -50%) scale(var(--pin-scale)); transform-origin: center; width: 16px; height: 16px; border-radius: 50%; background: #dc2626; border: 2px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.35); }
.pin:hover, .pin:focus-visible { z-index: 20; }
.pin.is-selected { background: #2563eb; box-shadow: 0 0 0 5px rgba(37, 99, 235, .22), 0 1px 5px rgba(0,0,0,.35); }
.pin::after { content: attr(data-label); position: absolute; left: 16px; top: -9px; min-width: 80px; max-width: 180px; transform: scale(var(--label-scale)); transform-origin: left top; pointer-events: none; color: #111827; background: rgba(255,255,255,.9); border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
aside { display: grid; grid-template-rows: auto minmax(160px, .5fr) minmax(180px, .5fr) auto; overflow: hidden; }
.panel { padding: 12px; border-bottom: 1px solid var(--line); }
.panel:last-child { border-bottom: 0; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 6px; padding: 8px; background: #fbfcfd; }
.stat strong { display: block; font-size: 22px; }
.stat span { color: var(--muted); font-size: 12px; }
textarea { width: 100%; min-height: 220px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; padding: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5; }
.table-wrap { overflow: auto; max-height: 260px; border: 1px solid var(--line); border-radius: 6px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { position: sticky; top: 0; background: #f8fafc; }
.badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 8px; font-size: 12px; background: #e2e8f0; color: #334155; }
.badge.warn { background: #fef3c7; color: var(--warn); }
.badge.good { background: #d1fae5; color: var(--good); }
.help { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
.route-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.vehicle-tools { display: grid; gap: 8px; margin-bottom: 10px; }
.vehicle-list { display: flex; flex-wrap: wrap; gap: 8px; }
.vehicle-button { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 6px 10px; }
.vehicle-button.is-active { border-color: var(--accent); background: #ecfdf5; color: #065f46; font-weight: 600; }
.vehicle-swatch { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,.2); flex: 0 0 auto; }
.vehicle-add { display: flex; gap: 8px; }
.vehicle-add input { flex: 1; min-width: 0; }
.route-list { display: grid; gap: 8px; max-height: 220px; overflow: auto; }
.route-item { border: 1px solid var(--line); border-radius: 6px; padding: 8px; background: #fbfcfd; }
.route-item strong { display: block; font-size: 13px; margin-bottom: 4px; }
.route-item span { display: block; color: var(--muted); font-size: 12px; line-height: 1.45; white-space: normal; }
.route-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.route-vehicle { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-size: 12px; font-weight: 600; }
.route-stops { display: grid; gap: 6px; }
.route-stop { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 7px; align-items: start; padding-top: 6px; border-top: 1px solid #edf1f5; }
.route-stop:first-child { border-top: 0; padding-top: 0; }
.route-stop-number { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: #e2e8f0; color: #334155; font-size: 12px; font-weight: 700; }
.route-stop-body strong { margin: 0 0 2px; }
@media (max-width: 980px) { main { grid-template-columns: 1fr; } aside { grid-template-rows: auto; } }
</style>

<header><h1>ALBO 配車支援 MVP 2nd</h1></header>
<main>
  <section>
    <div class="toolbar">
      <input id="mapFile" type="file" accept="image/png,image/jpeg,image/webp">
      <input id="userCsv" type="file" accept=".csv,text/csv">
      <div class="zoom-controls">
        <button id="zoomOut" type="button" title="縮小">-</button>

        <button id="zoomIn" type="button" title="拡大">+</button>
        <button id="zoomReset" class="zoom-reset" type="button">100%</button>
      </div>
      <span id="mapSize" class="badge">地図読込中</span>
    </div>
    <div id="mapViewport" class="map-wrap">
      <div id="mapZoomSurface" class="map-zoom-surface">
        <div id="mapStage" class="map-stage">
          <img id="mapImage" alt="伊勢崎市 地図画像">
          <svg id="connectionLayer" class="connection-layer" aria-hidden="true"></svg>
          <div class="placeholder">地図の上に利用者位置を表示します。<br>座標は画像左上を原点にしたピクセル値です。</div>
        </div>
      </div>
    </div>
  </section>
  <aside>
    <div class="panel">
      <h2 style="font-size:16px;margin:0 0 8px;">接続リスト</h2>
      <div class="vehicle-tools">
        <div id="vehicleList" class="vehicle-list"></div>
        <div class="vehicle-add">
          <input id="vehicleName" type="text" placeholder="車を追加 例: 車3">
          <button id="addVehicle" type="button">追加</button>
        </div>
      </div>
      <div class="route-actions">
        <button id="exportRoutes" class="primary" type="button">ルート出力</button>
        <button id="undoConnection" type="button">1本戻す</button>
        <button id="clearConnections" type="button">選択中の車の路線をクリア</button>
        <span id="connectionHint" class="badge">点を2つクリック</span>
      </div>
      <div id="connectionList" class="route-list"></div>
    </div>
    <div class="panel">
      <div class="stats">
        <div class="stat"><strong id="totalCount">0</strong><span>CSV行</span></div>
        <div class="stat"><strong id="matchedCount">0</strong><span>表示</span></div>
        <div class="stat"><strong id="unmatchedCount">0</strong><span>未対応</span></div>
      </div>
      <p class="help">現在読み込まれている利用者データの状態です。</p>
    </div>
    <div class="panel">
      <h2 style="font-size:16px;margin:0 0 8px;">未対応住所</h2>
      <div class="table-wrap"><table><thead><tr><th>利用者</th><th>住所</th><th>理由</th></tr></thead><tbody id="unmatchedRows"></tbody></table></div>
    </div>
    <div hidden>
      <textarea id="masterText" spellcheck="false"></textarea>
    </div>
  </aside>
</main>

function normalizeJapaneseNumerals(value) {
  const map = { '一': 1, '二': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };
  return String(value || '').replace(/([一二三四五六七八九十]+)丁目/g, (_, raw) => {
    if (raw === '十') return '10丁目';
    if (raw.length === 1) return `${map[raw]}丁目`;
    if (raw.startsWith('十')) return `${10 + map[raw.slice(1)]}丁目`;
    if (raw.endsWith('十')) return `${map[raw[0]] * 10}丁目`;
    if (raw.includes('十')) return `${map[raw[0]] * 10 + map[raw.slice(-1)]}丁目`;
    return raw + '丁目';
  });
}

const normalizeAddress = value => normalizeJapaneseNumerals(value)
  .replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
  .replace(/[　\s]/g, '')
  .replace(/[－ー―‐]/g, '-')
  .replace(/丁目/g, '-')
  .replace(/番地/g, '-')
  .replace(/番/g, '-')
  .replace(/号/g, '')
  .replace(/-+/g, '-')
  .replace(/-$/g, '');

function completeIsesakiAddress(value) {
  const text = String(value || '').trim();
  if (!text) return '';
  if (text.includes('伊勢崎市')) return text;
  if (/^[^\s]+[都道府県]/.test(text)) return text;
  if (/^[^都道府県]*市/.test(text)) return `群馬県${text}`;
  return `群馬県伊勢崎市${text}`;
}

function parseCsv(text) {
  const rows = [];
  let row = [], field = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], next = text[i + 1];
    if (quoted) {
      if (ch === '"' && next === '"') { field += '"'; i++; }
      else if (ch === '"') quoted = false;
      else field += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === ',') { row.push(field); field = ''; }
    else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (ch !== '\r') field += ch;
  }
  row.push(field); rows.push(row);
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

function toCsv(rows) {
  return rows.map(row => row.map(value => '"' + String(value ?? '').replace(/"/g, '""') + '"').join(',')).join('\n');
}

function rowsToObjects(rows) {
  const headers = rows.shift().map(h => String(h).trim());
  return rowsToObjectsWithHeaders(headers, rows);
}

function rowsToObjectsWithHeaders(headers, rows) {
  return rows.map(cols => Object.fromEntries(headers.map((h, i) => [h, cols[i] ?? ''])));
}

function masterObjectsToCsv(rows) {
  const headers = ['type', 'postalCode', 'address', 'town', 'x', 'y', 'note'];
  return toCsv([headers, ...rows.map(row => headers.map(header => row[header] ?? ''))]);
}

function loadLiteTownIndex() {
  if (!window.ISESAKI_ADDRESS_DB_LIGHT?.towns?.length) {
    liteTowns = [];
    liteTownIndex = [];
    return;

  liteTowns = window.ISESAKI_ADDRESS_DB_LIGHT.towns.map(item => ({
    ...item,
    key: normalizeAddress(item.fullAddress || `群馬県伊勢崎市${item.name || ''}`)
  })).filter(item => item.name && item.key);

  liteTownIndex = [...liteTowns].sort((a, b) => b.key.length - a.key.length);
}

function buildLiteMasterFromDb() {
  if (!liteTowns.length) return false;
  const rows = liteTowns.map(item => ({
    type: 'town',

    town: item.name,
    x: item.x,
    y: item.y,
    note: `軽量DB: ${item.source || 'town'} (source=${item.mapSource || item.source || 'estimated'})`
  }));

  el('masterText').value = masterObjectsToCsv(rows);
  return true;
}

function parseLotTokenFromAddress(suffix) {
  const matched = String(suffix || '').match(/^([0-9]+|[甲乙丙])/);
  if (!matched) return null;
  const token = matched[1];
  if (!token) return null;
  if (/^\d+$/.test(token)) {
    const index = Number(token);
    return Number.isFinite(index) ? { index, raw: token } : null;
  }
  if (LOT_SYMBOLS[token]) return { index: LOT_SYMBOLS[token], raw: token };
  return null;
}

function findLiteTown(address) {
  if (!liteTownIndex.length) return null;
  const normalized = normalizeAddress(completeIsesakiAddress(address));
  return liteTownIndex.find(item => normalized.startsWith(item.key)) || null;
}

function hashSeed(value) {
  let hash = 2166136261;
  for (let i = 0; i < value.length; i++) {
    hash ^= value.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}

function lotOffsetBySeed(town, lotIndex, suffix, baseX, baseY) {
  if (!Number.isFinite(baseX) || !Number.isFinite(baseY)) return { x: baseX, y: baseY, label: '' };
  if (!Number.isFinite(lotIndex)) return { x: baseX, y: baseY, label: '' };
  const mapWidth = (window.ISESAKI_ADDRESS_DB_LIGHT?.map?.width || 447);
  const mapHeight = (window.ISESAKI_ADDRESS_DB_LIGHT?.map?.height || 496);
  const seed = hashSeed(`群馬県伊勢崎市${town}${lotIndex}番地`);
  const angle = ((seed % 360) * Math.PI) / 180;
  const radius = 9 + (lotIndex % 6) * 2;
  const dx = Math.round(Math.cos(angle) * radius);
  const dy = Math.round(Math.sin(angle) * radius);
  return {
    x: Math.max(0, Math.min(mapWidth, baseX + dx)),
    y: Math.max(0, Math.min(mapHeight, baseY + dy)),
    label: `町域基準＋擬似オフセット ${suffix || ''}`
  };
}

function resolveLiteAddress(address) {
  const normalized = normalizeAddress(completeIsesakiAddress(address));
  const matchedTown = findLiteTown(normalized);
  if (!matchedTown) return null;

  const suffix = normalized.slice(matchedTown.key.length).replace(/^[-ー−－‐]+/, '');
  const lot = parseLotTokenFromAddress(suffix);
  if (!lot) {
    return {
      type: 'town-lite',
      postalCode: '',
      address: matchedTown.fullAddress,
      town: matchedTown.name,
      x: matchedTown.x,
      y: matchedTown.y,
      note: matchedTown.note || '軽量DB: 町域代表点',
      key: matchedTown.key,
      _lite: true
    };
  }

  return {
    type: 'lot-lite',
    postalCode: '',
    address: `${matchedTown.fullAddress}${lot.raw}`,
    town: matchedTown.name,
    x: matchedTown.x,
    y: matchedTown.y,
    lotIndex: lot.index,
    lotRaw: lot.raw,
    note: `${matchedTown.note || '軽量DB: 町域代表点'}; lot=${lot.raw}`,
    key: matchedTown.key,
    _lite: true
  };
}

function loadMasterFromText() {
  addressMaster = rowsToObjects(parseCsv(el('masterText').value)).map(row => ({
    type: row.type || 'exact',
    postalCode: row.postalCode || '',
    address: row.address || '',
    town: row.town || '',
    x: row.x === '' ? null : Number(row.x),
    y: row.y === '' ? null : Number(row.y),
    note: row.note || '',
    key: normalizeAddress(row.address)
  }));
}

function findAddress(address) {
  const key = normalizeAddress(completeIsesakiAddress(address));
  const exact = addressMaster.find(row => row.type === 'exact' && row.key === key);
  if (exact) return exact;

  const liteHit = resolveLiteAddress(key);
  if (liteHit) return liteHit;

  const town = addressMaster
    .filter(row => ['lot', 'town'].includes(row.type) && key.startsWith(row.key))
    .sort((a, b) => b.key.length - a.key.length)[0];
  return town || null;
}

function resolvePlotPoint(hit, address) {
  const base = { x: hit.x, y: hit.y, note: hit.note || '' };
  if (hit._lite && Number.isFinite(hit.lotIndex)) {
    return lotOffsetBySeed(hit.town, hit.lotIndex, hit.lotRaw, base.x, base.y);
  }

  if (hit.type === 'lot' || hit.type === 'town' || hit.type === 'town-lite') {
    return base;
  }

  if (hit.type === 'chome') {
    const tail = normalizeAddress(address).replace(normalizeAddress(hit.town), '');
    const lot = parseLotTokenFromAddress(tail);
    if (!lot) return base;
    return lotOffsetBySeed(hit.town, lot.index, lot.raw, base.x, base.y);
  }
  return base;
}

function hasUsableMapCoordinates(x, y) {
  return Number.isFinite(x) && Number.isFinite(y) && x > 0 && y > 0;
}

function detectColumn(headers, candidates) {
  return headers.find(h => candidates.includes(String(h).trim())) || '';
}

function findUserHeaderRow(rows) {
  return rows.findIndex(row => detectColumn(row.map(h => String(h).trim()), ADDRESS_COLUMNS));
}

function readUsers(csvText) {
  const rows = parseCsv(csvText);
  const headerIndex = findUserHeaderRow(rows);
  if (headerIndex < 0) throw new Error('住所列が見つかりません。列名を「住所」にしてください。');

  const headers = rows[headerIndex].map(h => String(h).trim());
  const addressCol = detectColumn(headers, ADDRESS_COLUMNS);
  const nameCol = detectColumn(headers, NAME_COLUMNS);
  if (!addressCol) throw new Error('住所列が見つかりません。列名を「住所」にしてください。');
  return rowsToObjectsWithHeaders(headers, rows.slice(headerIndex + 1))
    .filter(row => Object.values(row).some(value => String(value || '').trim() !== ''))
    .map((row, index) => ({
    index: index + 1,
    name: row[nameCol] || `利用者${index + 1}`,
    address: row[addressCol] || ''
  }));
}

  renderVehicleControls();
  setPendingConnection('');
  renderConnections();
}

function setPendingConnection(userId) {
  pendingConnectionUserId = userId ? String(userId) : '';
  if (pendingConnectionUserId) {
    vehicleCursorById[activeVehicleId] = pendingConnectionUserId;
  } else {
    delete vehicleCursorById[activeVehicleId];
  }
  document.querySelectorAll('.pin').forEach(pin => {
    pin.classList.toggle('is-selected', pin.dataset.userId === pendingConnectionUserId);
  });
  const point = getPointByUserId(pendingConnectionUserId);
  const vehicle = getVehicle(activeVehicleId);
  el('connectionHint').textContent = point ? `${vehicle.name}: ${point.name} から続ける` : `${vehicle.name}: 開始点をクリック`;
}

function handlePinConnectionClick(userId) {
  const nextUserId = String(userId);
  if (!pendingConnectionUserId) {
    setPendingConnection(nextUserId);
    return;
  }
  if (pendingConnectionUserId === nextUserId) {
    setPendingConnection('');
    return;
  }

  const exists = connections.find(item => {
    if (item.vehicleId !== activeVehicleId) return false;
    return (item.fromId === pendingConnectionUserId && item.toId === nextUserId) ||
      (item.fromId === nextUserId && item.toId === pendingConnectionUserId);
  });
  if (exists) {
    exists.vehicleId = activeVehicleId;
  } else {
    connections.push({ fromId: pendingConnectionUserId, toId: nextUserId, vehicleId: activeVehicleId });
  }
  setPendingConnection(nextUserId);
  renderConnections();
}

function undoLastConnection() {
  const removeIndex = connections.map(item => item.vehicleId).lastIndexOf(activeVehicleId);
  if (removeIndex < 0) {
    setPendingConnection('');
    renderConnections();
    return;
  }
  const removed = connections.splice(removeIndex, 1)[0];
  setPendingConnection(removed.fromId);
  renderConnections();
}

function pruneConnections() {
  const visibleIds = new Set(lastPointRows.filter(row => row.status === '表示').map(row => String(row.index)));
  connections = connections.filter(item => visibleIds.has(item.fromId) && visibleIds.has(item.toId));
  if (pendingConnectionUserId && !visibleIds.has(pendingConnectionUserId)) setPendingConnection('');
}

function getVehicleStops(vehicleId) {
  const stops = [];
  connections.forEach((item, index) => {
    if (item.vehicleId !== vehicleId) return;
    const from = getPointByUserId(item.fromId);
    const to = getPointByUserId(item.toId);
    if (!from || !to) return;

    if (!stops.length || stops[stops.length - 1].point.index !== from.index) {
      stops.push({ point: from, connectionIndex: null });
    }
    stops.push({ point: to, connectionIndex: index });
  });
  return stops;
}

function renderConnectionList() {
  const list = el('connectionList');
  const vehicle = getVehicle(activeVehicleId);
  const stops = getVehicleStops(activeVehicleId);
  if (!stops.length) {
    list.innerHTML = `<div class="route-item">
      <div class="route-meta">
        <span class="route-vehicle"><span class="vehicle-swatch" style="background:${escapeHtml(vehicle.color)}"></span>${escapeHtml(vehicle.name)}</span>
      </div>
      <span>この車の路線はまだありません</span>
    </div>`;
    return;
  }

  list.innerHTML = `<div class="route-item">
      <div class="route-meta">
        <span class="route-vehicle"><span class="vehicle-swatch" style="background:${escapeHtml(vehicle.color)}"></span>${escapeHtml(vehicle.name)}</span>
      </div>
      <div class="route-stops">
        ${stops.map((stop, index) => `<div class="route-stop">
          <div class="route-stop-number">${index + 1}</div>
          <div class="route-stop-body">
            <strong>${escapeHtml(stop.point.name)}</strong>
            <span>${escapeHtml(stop.point.address)}</span>
          </div>
        </div>`).join('')}
      </div>
    </div>`;
}

function renderConnections() {
  const layer = el('connectionLayer');
  const stage = el('mapStage');
  layer.setAttribute('width', Number.parseFloat(stage.style.width) || stage.offsetWidth || 1200);
  layer.setAttribute('height', Number.parseFloat(stage.style.height) || stage.offsetHeight || 820);
  layer.innerHTML = '';

  for (const item of connections) {
    const fromPin = getDisplayedPin(item.fromId);
    const toPin = getDisplayedPin(item.toId);
    if (!fromPin || !toPin) continue;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('class', 'connection-line');
    line.setAttribute('stroke', getVehicle(item.vehicleId).color);
    line.setAttribute('x1', Number.parseFloat(fromPin.style.left) || fromPin.dataset.baseX || 0);
    line.setAttribute('y1', Number.parseFloat(fromPin.style.top) || fromPin.dataset.baseY || 0);
    line.setAttribute('x2', Number.parseFloat(toPin.style.left) || toPin.dataset.baseX || 0);
    line.setAttribute('y2', Number.parseFloat(toPin.style.top) || toPin.dataset.baseY || 0);
    layer.appendChild(line);
  }
  renderConnectionList();
}

function getRouteExportStamp() {
  const now = new Date();
  const pad = value => String(value).padStart(2, '0');
  return {
    label: `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`,
    filename: `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}`
  };
}

function exportRoutes() {
  const stamp = getRouteExportStamp();
  const headers = ['出力日時', '車両', '車両ID', '順番', '利用者名', '住所', 'X座標', 'Y座標', '次の利用者名', '次の住所'];
  const rows = [];

  vehicles.forEach(vehicle => {
    const stops = getVehicleStops(vehicle.id);
    stops.forEach((stop, index) => {
      const nextStop = stops[index + 1]?.point || null;
      rows.push([
        stamp.label,
        vehicle.name,
        vehicle.id,
        index + 1,
        stop.point.name,
        stop.point.address,
        stop.point.x,
        stop.point.y,
        nextStop?.name || '',
        nextStop?.address || ''
      ]);
    });
  });

  if (!rows.length) {
    alert('出力できるルートがありません。先に点をつないでください。');
    return;
  }

  downloadCsv(`arbos-routes-${stamp.filename}.csv`, [headers, ...rows]);
}

function spreadOverlappingPins() {
  const pins = [...document.querySelectorAll('.pin')];
  if (!pins.length) {
    renderConnections();
    return;
  }

  const threshold = 14;
  const groups = [];
  for (const pin of pins) {
    const x = Number(pin.dataset.baseX);
    const y = Number(pin.dataset.baseY);
    pin.style.left = `${x}px`;
    pin.style.top = `${y}px`;

    let group = groups.find(items => items.some(item => {
      const dx = (x - item.x) * mapZoom;
      const dy = (y - item.y) * mapZoom;
      return Math.hypot(dx, dy) < threshold;
    }));
    if (!group) {
      group = [];
      groups.push(group);
    }
    group.push({ pin, x, y });
  }

  for (const group of groups) {
    if (group.length < 2) continue;
    const radius = Math.min(28, 8 + group.length * 3);
    group.forEach((item, index) => {
      const angle = (Math.PI * 2 * index) / group.length - Math.PI / 2;
      const offsetX = Math.cos(angle) * radius / mapZoom;
      const offsetY = Math.sin(angle) * radius / mapZoom;
      item.pin.style.left = `${item.x + offsetX}px`;
      item.pin.style.top = `${item.y + offsetY}px`;
    });
  }
  renderConnections();
}

function renderUsers(users) {
  clearPins();
  const unmatched = [];
  lastPointRows = [];
  let matched = 0;
  for (const user of users) {
    const hit = findAddress(user.address);
    if (!hit) {
      unmatched.push([user.name, user.address, 'マスタなし']);
      lastPointRows.push({ ...user, status: 'マスタなし', x: '', y: '', matchedAddress: '', note: '' });
      continue;
    }
    if (!hasUsableMapCoordinates(hit.x, hit.y)) {
      unmatched.push([user.name, user.address, '座標未設定']);
      lastPointRows.push({ ...user, status: '座標未設定', x: '', y: '', matchedAddress: hit.address || '', note: hit.note || '' });
      continue;
    }
    const point = resolvePlotPoint(hit, user.address);
    const pin = document.createElement('button');
    pin.className = 'pin';
    pin.type = 'button';
    pin.style.left = `${point.x}px`;
    pin.style.top = `${point.y}px`;
    pin.dataset.baseX = point.x;
    pin.dataset.baseY = point.y;
    pin.dataset.userId = user.index;
    pin.dataset.label = user.name;
    pin.title = `${user.name}
${user.address}
${hit.address}
${point.note}`;
    pin.addEventListener('click', event => {
      event.stopPropagation();
      handlePinConnectionClick(user.index);
    });
    el('mapStage').appendChild(pin);
    matched++;
    lastPointRows.push({
      ...user,
      status: '表示',
      x: point.x,
      y: point.y,
      matchedAddress: hit.address || '',
      note: point.note || hit.note || ''
    });
  }
  el('totalCount').textContent = users.length;
  el('matchedCount').textContent = matched;
  el('unmatchedCount').textContent = unmatched.length;
  el('unmatchedRows').innerHTML = unmatched.length
    ? unmatched.map(r => `<tr><td>${escapeHtml(r[0])}</td><td>${escapeHtml(r[1])}</td><td><span class="badge warn">${escapeHtml(r[2])}</span></td></tr>`).join('')
    : '<tr><td colspan="3"><span class="badge good">未対応なし</span></td></tr>';
  pruneConnections();
  setPendingConnection(pendingConnectionUserId);
  spreadOverlappingPins();
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
}

function getMapBaseSize() {
  const stage = el('mapStage');
  return {
    width: Number.parseFloat(stage.style.width) || stage.offsetWidth || 1200,
    height: Number.parseFloat(stage.style.height) || stage.offsetHeight || 820
  };
}

function applyMapZoom() {
  const stage = el('mapStage');
  const pinScreenScale = Math.max(0.72, Math.min(1, 1 / Math.sqrt(mapZoom)));
  const labelScreenScale = Math.max(0.92, Math.min(1, 1 / Math.sqrt(mapZoom)));
  stage.style.transform = `translate(${mapPanX}px, ${mapPanY}px) scale(${mapZoom})`;
  stage.style.setProperty('--pin-scale', pinScreenScale / mapZoom);
  stage.style.setProperty('--label-scale', labelScreenScale / pinScreenScale);
  el('zoomLevel').textContent = Math.round(mapZoom * 100) + '%';
  spreadOverlappingPins();
}

function getViewportCenterOrigin() {
  const viewport = el('mapViewport');
  return {
    clientX: viewport.clientWidth / 2,
    clientY: viewport.clientHeight / 2
  };
}

function setMapZoom(value, origin = getViewportCenterOrigin()) {
  const previousZoom = mapZoom;
  const nextZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Math.round(value * 100) / 100));
  if (nextZoom === previousZoom) return;

  const mapX = (origin.clientX - mapPanX) / previousZoom;
  const mapY = (origin.clientY - mapPanY) / previousZoom;
  mapZoom = nextZoom;
  mapPanX = origin.clientX - mapX * mapZoom;
  mapPanY = origin.clientY - mapY * mapZoom;
  applyMapZoom();
}

function fitMapToViewport() {
  const viewport = el('mapViewport');
  const size = getMapBaseSize();
  if (!viewport.clientWidth || !size.width) return;
  const fitZoom = Math.min(
    ZOOM_MAX,
    Math.max(ZOOM_MIN, Math.min(
      (viewport.clientWidth - MAP_PADDING * 2) / size.width,
      (viewport.clientHeight - MAP_PADDING * 2) / size.height
    ))
  );
  mapZoom = Math.min(1, Math.round(fitZoom * 100) / 100);
  mapPanX = (viewport.clientWidth - size.width * mapZoom) / 2;
  mapPanY = (viewport.clientHeight - size.height * mapZoom) / 2;
  applyMapZoom();
}

function enableMapPanAndZoom() {
  const viewport = el('mapViewport');
  let isPanning = false;
  let startX = 0;
  let startY = 0;
  let startPanX = 0;
  let startPanY = 0;

  viewport.addEventListener('wheel', event => {
    event.preventDefault();
    const direction = event.deltaY < 0 ? 1 : -1;
    const rect = viewport.getBoundingClientRect();
    setMapZoom(mapZoom + direction * ZOOM_STEP, {
      clientX: event.clientX - rect.left,
      clientY: event.clientY - rect.top
    });
  }, { passive: false });

  viewport.addEventListener('pointerdown', event => {
    if (event.target.closest('input, textarea, label, button')) return;
    isPanning = true;
    startX = event.clientX;
    startY = event.clientY;
    startPanX = mapPanX;
    startPanY = mapPanY;
    viewport.classList.add('is-panning');
    viewport.setPointerCapture(event.pointerId);
  });

  viewport.addEventListener('pointermove', event => {
    if (!isPanning) return;
    mapPanX = startPanX + event.clientX - startX;
    mapPanY = startPanY + event.clientY - startY;
    applyMapZoom();
  });

  const stopPanning = event => {
    if (!isPanning) return;
    isPanning = false;
    viewport.classList.remove('is-panning');
    if (viewport.hasPointerCapture(event.pointerId)) viewport.releasePointerCapture(event.pointerId);
  };

  viewport.addEventListener('pointerup', stopPanning);
  viewport.addEventListener('pointercancel', stopPanning);
}

function loadMapSource(src) {
  const image = el('mapImage');
  image.onload = () => {
    const stage = el('mapStage');
    stage.classList.add('has-image');
    stage.style.width = image.naturalWidth + 'px';
    stage.style.height = image.naturalHeight + 'px';
    el('mapSize').textContent = `${image.naturalWidth} x ${image.naturalHeight} px`;
    fitMapToViewport();
    renderUsers(lastUsers);
  };
  image.src = src;
}

function decodeCsvBuffer(buffer) {
  const labels = ['utf-8', 'shift_jis'];
  const candidates = labels.map(label => {
    const text = new TextDecoder(label).decode(buffer);
    const rows = parseCsv(text);
    const headerIndex = findUserHeaderRow(rows);
    const replacementCount = (text.match(/\uFFFD/g) || []).length;
    return { text, score: (headerIndex >= 0 ? 1000 : 0) - replacementCount };
  });
  return candidates.sort((a, b) => b.score - a.score)[0].text;
}

async function readCsvFileText(file) {
  return decodeCsvBuffer(await file.arrayBuffer());
}

async function loadUserCsvFile(file) {
  lastUsers = readUsers(await readCsvFileText(file));
  connections = [];
  vehicleCursorById = {};
  setPendingConnection('');
  renderUsers(lastUsers);
}

function downloadCsv(filename, rows) {
  const blob = new Blob(['\uFEFF' + toCsv(rows)], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

el('masterText').value = EMBEDDED_MASTER_CSV;
applyDefaultTownCoordinates();
loadMasterFromText();
loadMapSource(DEFAULT_MAP_SRC);
applyMapZoom();
enableMapPanAndZoom();
renderVehicleControls();
setPendingConnection('');

el('mapFile').addEventListener('change', event => {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    loadMapSource(reader.result);
  };
  reader.readAsDataURL(file);
});

el('userCsv').addEventListener('change', async event => {
  const file = event.target.files[0];
  if (!file) return;
  try {
    await loadUserCsvFile(file);
  } catch (error) {
    alert(error.message);
  }
});

document.addEventListener('dragover', event => {
  event.preventDefault();
  document.body.classList.add('drop-active');
});

document.addEventListener('dragleave', event => {
  if (!event.relatedTarget) document.body.classList.remove('drop-active');
});

document.addEventListener('drop', async event => {
  event.preventDefault();
  document.body.classList.remove('drop-active');
  const file = [...event.dataTransfer.files].find(item => /csv$/i.test(item.name) || item.type === 'text/csv');
  if (!file) return;
  try {
    await loadUserCsvFile(file);
  } catch (error) {
    alert(error.message);
  }
});

el('zoomOut').addEventListener('click', () => setMapZoom(mapZoom - ZOOM_STEP));
el('zoomIn').addEventListener('click', () => setMapZoom(mapZoom + ZOOM_STEP));
el('zoomReset').addEventListener('click', () => setMapZoom(1));

el('addVehicle').addEventListener('click', () => {
  addVehicleFromInput();
});

el('vehicleName').addEventListener('keydown', event => {
  if (event.key === 'Enter') {
    event.preventDefault();
    addVehicleFromInput();
  }
});

el('undoConnection').addEventListener('click', () => {
  undoLastConnection();
});

el('clearConnections').addEventListener('click', () => {
  connections = connections.filter(connection => connection.vehicleId !== activeVehicleId);
  delete vehicleCursorById[activeVehicleId];
  setPendingConnection('');
  renderConnections();
});

el('exportRoutes').addEventListener('click', () => {
  exportRoutes();
});

renderUsers([]);
</script>
