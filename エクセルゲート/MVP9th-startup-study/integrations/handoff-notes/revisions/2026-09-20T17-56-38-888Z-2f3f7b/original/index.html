<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>引継ぎメモ</title>
<style>body{font:16px sans-serif;max-width:760px;margin:30px auto;color:#18314b}button,input,textarea{font:inherit;margin:6px;padding:8px}article{padding:12px;border-bottom:1px solid #ccd}aside{background:#edf4fa;padding:20px}textarea{width:90%;height:100px}[hidden]{display:none!important}</style>
</head><body><h1>引継ぎメモ</h1><p id="status">準備中</p>
<input id="filter" placeholder="メモを検索"><button id="add">追加</button><button id="export">JSON保存</button><label>JSON読込<input id="import" type="file" accept=".json"></label>
<main id="notes"></main><aside id="editor" hidden><textarea id="draft"></textarea><button id="commit">確定</button><button id="cancel">キャンセル</button></aside>
<script>
(()=>{
  const $=id=>document.getElementById(id);let state=null,editing=null;
  function normalize(value){if(value===null)return null;if(!Array.isArray(value)||value.some(n=>!n||typeof n.id!=='string'||typeof n.text!=='string'))throw Error('メモの形式が不正です');return JSON.parse(JSON.stringify(value))}
  function render(){const query=$('filter').value;$('notes').replaceChildren();for(const note of state||[]){if(!note.text.includes(query))continue;const article=document.createElement('article'),text=document.createElement('span'),button=document.createElement('button');text.textContent=note.text;button.textContent='編集';button.onclick=()=>open(note.id);article.append(text,button);$('notes').append(article)}}
  function persist(){localStorage.setItem('handoff-notes',JSON.stringify(state));$('status').textContent='ブラウザに保存済み'}
  function open(id=null){editing=id;$('draft').value=(state||[]).find(n=>n.id===id)?.text||'';$('editor').hidden=false}
  function commit(){if(!state)state=[];const note=state.find(n=>n.id===editing);if(note)note.text=$('draft').value;else state.push({id:crypto.randomUUID(),text:$('draft').value});$('editor').hidden=true;persist();render()}
  function add(text){if(!state)state=[];state.push({id:crypto.randomUUID(),text});persist();render()}
  async function importFile(file){try{const next=normalize(JSON.parse(await file.text()));state=next;persist();render()}catch(e){$('status').textContent=e.message}}
  function save(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='notes.json';a.click();URL.revokeObjectURL(a.href);$('status').textContent='JSON保存済み'}
  const ready=new Promise(resolve=>setTimeout(()=>{const saved=localStorage.getItem('handoff-notes');state=saved?normalize(JSON.parse(saved)):[{id:'sample',text:'使い方のサンプル'}];render();$('status').textContent='編集できます';resolve()},40));
  $('add').onclick=()=>open();$('commit').onclick=commit;$('cancel').onclick=()=>{$('editor').hidden=true};$('filter').oninput=render;$('export').onclick=save;$('import').onchange=e=>{if(e.target.files[0])importFile(e.target.files[0])};
  window.NoteActions={add};
})();
</script></body></html>
