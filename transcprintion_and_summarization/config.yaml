watch:
  root_dir: "/Users/tama2025mini/Library/Mobile Documents/iCloud~com~openplanetsoftware~just-press-record"
  recursive: true
  extensions:
    - ".wav"
    - ".m4a"
  stability_wait_seconds: 2
  stability_checks: 3

transcription:
  whisper_cpp:
    bin_path: "/Users/tama2025mini/work/tools/whisper.cpp/build/bin/whisper-cli"
    model_path: "/Users/tama2025mini/work/tools/whisper.cpp/models/ggml-large-v3-turbo-q8_0.bin"
    language: "ja"
    threads: 4
    no_timestamps: true

postprocess:
  enabled: true
  model: "openai/gpt-oss-20b"
  api_base: "http://localhost:1234/v1"
  api_key: "lm-studio"
  system_prompt: |
    あなたは音声入力テキストを処理する医療現場向けのアシスタントです。
    以下のタスクを実行し、JSON形式で結果を返してください。

    【入力テキスト】
    {transcribed_text}

    【タスク】
    1. タイトル生成：テキストの内容を20-30文字で要約したタイトルを作成
    2. 軽微な整形：文字起こしミスの修正、適切な句読点の追加（内容は変えない）
    3. 機密レベル判定：以下の基準で分類
      - "個人情報含む"：患者名、診療情報、個人を特定できる情報が含まれる
      - "院内限り"：業務情報、院内の人名・部署名が含まれる
      - "公開可"：上記に該当しない一般的な内容

    【出力形式】
    {
      "title": "生成したタイトル",
      "formatted_text": "整形後のテキスト",
      "confidentiality_level": "個人情報含む" または "院内限り" または "公開可"
    }

    【注意事項】
    - 内容の改変や追加はしない
    - 判断に迷う場合は厳しめに判定する（公開可より院内限り、院内限りより個人情報含む）
    - JSONのみを返し、説明文は不要

notion:
  enabled: true
  database_id: "f590384ac7fa4a0a80a977f437cd76a8"
  properties:
    title: "タイトル"
    body: "本文"
    confidentiality_level: "LLMによる機密レベル"

state:
  db_path: ".data/processed.sqlite"
