<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>起動時間の比較</title>
<style>body{font:16px/1.7 system-ui,sans-serif;max-width:1100px;margin:32px auto;padding:0 24px;color:#17324d;background:#f4f7fa}section{background:white;padding:20px;margin:20px 0;border:1px solid #ccd8e2;border-radius:10px}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}th,td{border-bottom:1px solid #ccd8e2;text-align:right;padding:8px}th:first-child,td:first-child{text-align:left}button,input{font:inherit}button{margin:16px 0;padding:8px}small{display:block;overflow-wrap:anywhere}pre{white-space:pre-wrap}h1{font-size:28px}</style>
<h1>「編集する」から操作可能になるまで</h1><p>A 旧方式、B 最小改修、C HTML直開きの計測JSONをまとめて選んでください。処理はこのPC内で完結します。</p>
<input id="files" type="file" accept=".json" multiple><button id="save" disabled>集計結果を保存</button><p id="status">実測結果はまだ読み込まれていません。</p><div id="results"></div>
<p>起動済み／未起動、ブック、データ条件、ブラウザ版が違う結果は別集計です。各条件・各方式で5回以上を推奨します。P90は遅い側10%の境界（nearest rank）、最大は最も遅かった回です。少数回の差だけで採用を決めません。</p>
<script src="summary.js"></script><script>
let result;const $=s=>document.querySelector(s),sec=n=>(n/1000).toFixed(3)+' 秒',names={baseline:'A 旧方式',minimal:'B 最小改修',direct:'C HTML直開き'};
$('#files').onchange=async e=>{const records=[],errors=[];for(const file of e.target.files){try{if(file.size>1000000)throw Error('大きすぎるファイル');records.push(JSON.parse(await file.text()));}catch{errors.push('読込不可');}}result=StartupSummary.summarize(records);$('#results').replaceChildren();$('#status').textContent='読込 '+records.length+' 件／除外 '+(errors.length+result.rejected.length)+' 件 '+[...errors,...result.rejected].join('、');
for(const g of result.groups){const s=document.createElement('section'),h=document.createElement('h2');h.textContent=({warm:'Edge起動済み',cold:'Edge未起動',unknown:'起動状態未記録'}[g.browserState]||g.browserState)+' ／ '+g.host+' ／ '+g.dataSet;s.append(h);const t=document.createElement('table');t.innerHTML='<tr><th>方式</th><th>回数</th><th>平均</th><th>中央値</th><th>P90</th><th>最大</th></tr>';for(const [k,v]of Object.entries(g.profiles)){const tr=t.insertRow();for(const value of[names[k],v.total.n,sec(v.total.mean),sec(v.total.median),sec(v.total.p90),sec(v.total.max)])tr.insertCell().textContent=value;}s.append(t);for(const [label,value]of[['A−B 中央値の短縮',g.medianReductionMs],['B−C 中央値の残差',g.medianRemainingVsDirectMs]])if(value!==null){const p=document.createElement('p');p.textContent=label+'：'+sec(value);s.append(p);}const d=document.createElement('details'),summary=document.createElement('summary'),pre=document.createElement('pre');summary.textContent='工程別の集計（ミリ秒）';pre.textContent=JSON.stringify(g.profiles,null,2);d.append(summary,pre);s.append(d);const small=document.createElement('small');small.textContent=g.browser;s.append(small);$('#results').append(s);}$('#save').disabled=false;};
$('#save').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='startup-summary.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
</script></html>
