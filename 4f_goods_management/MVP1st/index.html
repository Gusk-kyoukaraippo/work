<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>物品QR管理 MVP1st</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header>
    <h1>物品QR管理システム（MVP1st）</h1>
    <p>ノートPC 10台を前提にした初期MVP</p>
  </header>

  <main>
    <section class="card">
      <h2>F-01 QRチェック記録</h2>
      <div class="scan-grid">
        <div>
          <div class="controls">
            <button id="btn-start" class="primary">カメラ開始</button>
            <button id="btn-stop" class="ghost" disabled>カメラ停止</button>
            <span id="scan-status" class="status">未起動</span>
          </div>
          <video id="camera" autoplay playsinline muted></video>
        </div>
        <div>
          <p>場所・確認者は任意（空欄でも保存可）。</p>
          <label for="scan-device-id">読取結果（自動入力）</label>
          <input id="scan-device-id" placeholder="QR読み取り後に自動反映されます" />
          <div class="row-2">
            <div class="field">
              <label for="scan-location">見かけた場所</label>
              <input id="scan-location" list="location-presets" placeholder="例: 倉庫" />
            </div>
            <div class="field">
              <label for="scan-checker">確認者</label>
              <input id="scan-checker" placeholder="任意" />
            </div>
          </div>
          <datalist id="location-presets">
            <option>倉庫</option>
            <option>6階病棟</option>
            <option>ナースステーション</option>
            <option>外来</option>
            <option>会議室</option>
          </datalist>
          <button id="btn-save-check" class="primary">チェック保存</button>
        </div>
      </div>
      <hr />
      <div class="row-2">
        <input id="manual-device-id" placeholder="手動入力: 機器ID" />
        <button id="btn-manual-check" class="ghost">手動でチェック保存</button>
      </div>
    </section>

    <section class="card">
      <h2>F-02 機器一覧・状態</h2>
      <div class="row-2">
        <label>
          種別フィルタ
          <select id="filter-type"><option value="all">全種別</option></select>
        </label>
        <label class="checkbox-line"><input type="checkbox" id="group-mode" checked /> 種別でグループ表示</label>
      </div>
      <div id="device-list"></div>
    </section>

    <section class="card">
      <h2>F-03 機器 / 種別管理</h2>
      <div class="admin-grid">
        <div>
          <h3>種別管理（追加・編集・削除）</h3>
          <div class="row-2">
            <input id="new-type" placeholder="新規種別名" />
            <button id="btn-add-type">種別を追加</button>
          </div>
          <div id="type-list" class="box-list"></div>
        </div>
        <div>
          <h3>機器登録 / 編集</h3>
          <div class="row-2">
            <div class="field">
              <label for="device-name">表示名</label>
              <input id="device-name" placeholder="PC-01（通し番号は任意）" />
            </div>
            <div class="field">
              <label for="device-type">種別</label>
              <select id="device-type"></select>
            </div>
          </div>
          <label for="device-note">備考</label>
          <input id="device-note" placeholder="任意" />
          <div class="row-2">
            <button id="btn-save-device" class="primary">機器を保存</button>
            <button id="btn-reset-device" class="ghost">編集解除</button>
          </div>
          <p id="editing-info" class="muted">新規登録モード</p>
        </div>
      </div>
      <div id="device-table-wrap"></div>
    </section>

    <section class="card">
      <h2>F-04 QRコード生成（表示名付き）</h2>
      <div class="controls">
        <button id="btn-build-qr" class="primary">QRを再生成</button>
        <button id="btn-print-qr" class="ghost">印刷用に表示して印刷</button>
      </div>
      <p class="muted">生成したQRは1枚ずつのカード表示。複数まとめて印刷できます。</p>
      <div id="qr-area" class="qr-grid"></div>
    </section>

    <section class="card">
      <h2>F-05 チェック履歴</h2>
      <div class="row-2">
        <select id="history-filter"><option value="all">全機器</option></select>
        <button id="btn-clear-history" class="ghost">履歴をすべて削除</button>
      </div>
      <div id="history-list" class="history-wrap"></div>
    </section>
  </main>

  <div id="toast" aria-live="polite"></div>
</body>
</html>
