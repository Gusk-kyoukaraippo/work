<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CTGS 手入力・転記支援アプリ v1.1.0</title>
<style>
  :root{
    --accent:#a84aa7;
    --accent-dark:#7f347e;
    --accent-soft:#f2e4f2;
    --accent-pale:#faf5fa;
    --ink:#222;
    --muted:#6b7280;
    --line:#d9dce2;
    --bg:#f4f6f8;
    --card:#fff;
    --ok:#19734b;
    --warn:#9a6700;
    --danger:#b42318;
    --info:#1769aa;
    --shadow:0 2px 10px rgba(0,0,0,.08);
    --app-header-height:65px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:"Yu Gothic UI","Meiryo",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}
  .hidden{display:none!important}
  .app-header{position:sticky;top:0;z-index:50;background:linear-gradient(90deg,var(--accent),#bd6abb);color:#fff;box-shadow:var(--shadow)}
  .header-main{display:flex;align-items:center;gap:14px;padding:12px 18px}
  .header-main>div:first-child{flex:0 0 auto}
  .app-title{font-size:22px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
  .app-sub{font-size:12px;opacity:.9}
  .header-spacer{flex:1}
  .security-badge{border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:5px 10px;font-size:12px;background:rgba(255,255,255,.14)}
  .header-actions{display:flex;gap:8px;flex-wrap:wrap}

  .backup-status-box{min-width:190px;border:1px solid rgba(255,255,255,.55);border-radius:8px;padding:5px 9px;background:rgba(255,255,255,.12);line-height:1.35}
  .backup-state{font-size:12px;font-weight:800}
  .backup-state.dirty{color:#fff4b8}
  .backup-state.saved{color:#d7ffe9}
  .backup-state.error{color:#ffd4d0}
  .backup-folder{font-size:10px;opacity:.9;max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .exit-screen{min-height:calc(100vh - 80px);display:flex;align-items:center;justify-content:center;padding:30px}
  .exit-card{max-width:650px;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:30px;text-align:center}
  .exit-card h2{margin:0 0 12px;color:var(--ok)}
  .exit-card .saved-file{margin:18px 0;padding:12px;background:#f3faf6;border:1px solid #b8dfc9;border-radius:8px;word-break:break-all;font-weight:700}
  .backup-help{font-size:12px;color:#5b6470;margin-top:10px;line-height:1.6}

  .modal.diff-modal{width:min(1240px,100%)}
  .diff-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .diff-pill{border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;background:#eef1f5}
  .diff-pill.add{background:#e8f6ee;color:#14613e}.diff-pill.change{background:#fff3d6;color:#795500}.diff-pill.manual{background:#fff0ef;color:#a32720}
  .diff-options{display:flex;gap:14px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fafafa;margin-bottom:12px}
  .diff-table-wrap{max-height:52vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
  .diff-table{min-width:980px}
  .diff-table th{top:0}.diff-table td{white-space:normal;vertical-align:top;font-size:12px}
  .diff-value{max-width:260px;word-break:break-word}.diff-manual{background:#fff7f6}.diff-add{background:#f5fbf7}
  .history-list{display:grid;gap:10px}.history-item{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fafafa}
  .btn{border:1px solid #c8cbd2;background:#fff;border-radius:7px;padding:8px 13px;color:#222;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .btn:hover{filter:brightness(.98)}
  .btn:focus-visible{outline:3px solid rgba(23,105,170,.25);outline-offset:1px}
  .btn.primary{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff}
  .btn.info{background:var(--info);border-color:var(--info);color:#fff}
  .btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn.warn{background:#fff7d6;border-color:#d7b94f;color:#5b4400}
  .btn.danger{background:#fff1f0;border-color:#e3a4a0;color:var(--danger)}
  .btn.small{padding:5px 9px;font-size:12px}
  .btn.icon{min-width:36px;padding:7px 9px}
  .main{max-width:1600px;margin:0 auto;padding:16px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
  .panel-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:#fff;border-radius:10px 10px 0 0}
  .panel-title{font-size:18px;font-weight:700}
  .panel-body{padding:16px}
  .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .toolbar .spacer{flex:1}
  .search{min-width:260px;padding:9px 11px;border:1px solid #bcc2cc;border-radius:7px;background:#fff}
  .summary-cards{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:10px;margin-bottom:14px}
  .summary-card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px 14px}
  .summary-card .num{font-size:26px;font-weight:800;line-height:1}
  .summary-card .label{font-size:12px;color:var(--muted);margin-top:6px}
  .table-wrap{overflow:auto;max-height:calc(100vh - 300px)}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:1150px}
  th,td{padding:9px 9px;border-bottom:1px solid var(--line);vertical-align:middle;text-align:left;white-space:nowrap}
  th{position:sticky;top:0;background:#f7eef7;z-index:2;font-size:12px;color:#4c3450}
  tbody tr:hover{background:#faf7fb}
  tbody tr.current{background:#f5e9f5}
  .status{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}
  .status.notstarted{background:#eceff3;color:#59616e}
  .status.editing{background:#fff4d6;color:#7a5400}
  .status.ready{background:#e8f3ff;color:#145b91}
  .status.done{background:#e7f6ee;color:#14613e}
  .progress{height:8px;width:130px;background:#e5e7eb;border-radius:999px;overflow:hidden}
  .progress>span{display:block;height:100%;background:var(--accent);border-radius:inherit}
  .row-actions{display:flex;gap:5px}
  .empty-state{text-align:center;padding:50px 20px;color:var(--muted)}
  .editor-shell{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
  .editor-sticky-stack{position:sticky;top:var(--app-header-height,65px);z-index:36;background:linear-gradient(180deg,var(--bg) 0%,var(--bg) calc(100% - 7px),rgba(244,246,248,0) 100%);padding-bottom:7px}
  .editor-sticky-stack .patient-sticky{position:relative;top:auto;z-index:auto}
  .sticky-action-line{margin-top:8px;padding:9px 10px!important;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.97);box-shadow:var(--shadow);backdrop-filter:blur(5px);flex-wrap:nowrap!important;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
  .sticky-action-line>*{flex:0 0 auto}
  .sticky-action-line .spacer{flex:1 0 12px}
  .patient-sticky{position:sticky;top:65px;z-index:35;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
  .patient-top{display:flex;align-items:center;gap:12px;padding:11px 14px;flex-wrap:wrap}
  .patient-id{font-size:20px;font-weight:800;color:var(--accent-dark)}
  .patient-meta{color:#444;font-size:13px;line-height:1.55}
  .patient-meta-main{font-weight:600}
  .patient-datetimes{display:flex;gap:6px 12px;flex-wrap:wrap;margin-top:2px;color:#555}
  .datetime-chip{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .datetime-label{font-weight:800;color:#6b4a6b}
  .patient-top .spacer{flex:1}
  .tabs{display:flex;gap:2px;padding:0 10px;border-top:1px solid #eee;background:#fafafa;border-radius:0 0 10px 10px;overflow-x:auto}
  .tab{border:none;background:transparent;padding:11px 14px;color:#4b5563;border-bottom:3px solid transparent;white-space:nowrap}
  .tab.active{color:var(--accent-dark);font-weight:800;border-bottom-color:var(--accent)}
  .tab.disabled{opacity:.35;pointer-events:none}
  .form-card{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
  .section-title{font-size:17px;font-weight:800;padding:12px 16px;background:var(--accent-soft);border-bottom:1px solid #d8c1d8;color:#533653}
  .group-title{padding:9px 16px;background:#f8f8f9;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-weight:800;color:#333}
  .fields{padding:0 14px}
  .field-row{display:grid;grid-template-columns:minmax(250px,38%) minmax(280px,1fr) 48px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #eceef1}
  .field-row:last-child{border-bottom:none}
  .field-row.is-unfilled{background:#fff8df;box-shadow:inset 4px 0 0 #d89a00;margin:0 -8px;padding-left:12px;padding-right:8px}
  .field-row.is-disabled{background:#eef0f2;color:#777;margin:0 -8px;padding-left:12px;padding-right:8px}
  .field-row.is-disabled .field-label{color:#747980}
  .field-row.is-disabled input,.field-row.is-disabled select,.field-row.is-disabled textarea,.field-row.is-disabled .choice button{background:#e1e4e8!important;color:#8a8f97!important;border-color:#c5c9cf!important;cursor:not-allowed;box-shadow:none}
  .field-row.is-disabled .copy-btn{background:#e1e4e8;color:#999;border-color:#c5c9cf;cursor:not-allowed}
  .field-state{display:inline-flex;align-items:center;border-radius:999px;padding:2px 7px;font-size:11px;font-weight:800;margin-left:7px;vertical-align:1px}
  .field-state.missing{background:#ffe5a3;color:#6c4700;border:1px solid #e0b34b}
  .field-state.excluded{background:#dfe3e8;color:#626871;border:1px solid #c3c8cf}
  .tab-missing-count{display:inline-flex;min-width:20px;height:20px;align-items:center;justify-content:center;margin-left:6px;padding:0 5px;border-radius:999px;background:#d97706;color:#fff;font-size:11px;font-weight:800}
  .input-state-guide{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 12px;border:1px solid #d8dce2;border-radius:8px;background:#fff;font-size:12px;color:#555}
  .guide-chip{display:inline-flex;align-items:center;gap:6px}
  .guide-swatch{width:17px;height:12px;border-radius:3px;border:1px solid #c7cbd1}
  .guide-swatch.missing{background:#fff8df;border-color:#e0b34b}
  .guide-swatch.excluded{background:#eef0f2}
  .field-label{font-weight:600;line-height:1.35}
  .field-label .req{color:var(--danger);font-size:12px;margin-left:5px}
  .field-help{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:3px}
  .control{min-width:0}
  input[type=text],input[type=number],input[type=date],input[type=time],input[type=month],select,textarea{width:100%;border:1px solid #aeb4bf;border-radius:6px;padding:8px 9px;background:#fff;color:#111}
  input[type=date],input[type=time],input[type=month]{min-height:39px;color-scheme:light}
  .partial-date-control{display:grid;grid-template-columns:minmax(180px,1fr) auto;gap:7px;align-items:center}
  .partial-date-control .partial-date-text{grid-column:1/2}
  .partial-date-control .partial-date-note{grid-column:1/-1;font-size:11px;color:var(--muted);line-height:1.45}
  .partial-date-toggle{white-space:nowrap}
  input:focus,select:focus,textarea:focus{outline:3px solid rgba(168,74,167,.18);border-color:var(--accent)}
  input[readonly]{background:#f1f3f5;color:#4b5563;border-color:#c6cbd2}
  textarea{min-height:76px;resize:vertical}
  .choice{display:flex;gap:0;flex-wrap:wrap}
  .choice button{border:1px solid #afb5bf;background:linear-gradient(#fff,#eceff2);padding:7px 16px;min-width:78px;margin-left:-1px;color:#333}
  .choice button:first-child{border-radius:6px 0 0 6px;margin-left:0}
  .choice button:last-child{border-radius:0 6px 6px 0}
  .choice button.active{background:#31a5d6;color:#fff;border-color:#2493c0;position:relative;z-index:1}
  .value-unknown{display:flex;gap:7px}
  .value-unknown .unknown-toggle{white-space:nowrap}
  .copy-btn{border:1px solid #c6cad1;background:#fff;border-radius:6px;padding:6px 8px;color:#555}
  .copy-btn.copied{background:#e7f6ee;color:var(--ok);border-color:#8dc6a9}
  .editor-actions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}
  .notice{padding:10px 12px;border-radius:8px;border:1px solid #c9d9e7;background:#eef7ff;color:#234b66;font-size:13px}
  .warnbox{padding:10px 12px;border-radius:8px;border:1px solid #ead28a;background:#fff9df;color:#604900;font-size:13px}
  .transfer-toolbar{position:relative;top:auto;z-index:auto;background:rgba(255,255,255,.97);backdrop-filter:blur(4px);padding:9px 10px}
  .transfer-toolbar .transfer-count{font-size:12px;font-weight:800;color:#4b5563;padding:6px 9px;border:1px solid #cfd4dc;border-radius:999px;background:#fff}
  .transfer-sheet-wrap{overflow:auto;padding:2px 0 18px}
  .transfer-sheet{width:min(1120px,100%);margin:0 auto;background:#fff;border:1px solid #b9bdc5;border-radius:5px;box-shadow:0 3px 14px rgba(0,0,0,.09);padding:26px 30px 32px}
  .transfer-document-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:12px;margin-bottom:18px}
  .transfer-document-title{text-align:center;font-size:22px;font-weight:800;letter-spacing:.04em}
  .transfer-document-id{text-align:right;font-size:14px;font-weight:800;white-space:nowrap}
  .transfer-document-meta{grid-column:1/-1;display:flex;justify-content:center;gap:10px 22px;flex-wrap:wrap;font-size:12px;color:#444;border-top:1px solid #d4d7dc;padding-top:8px}
  .transfer-form-section{margin-top:16px;scroll-margin-top:215px}
  .transfer-form-section:first-of-type{margin-top:0}
  .transfer-black-title{background:#111;color:#fff;font-weight:800;padding:4px 9px;font-size:14px;letter-spacing:.02em}
  .transfer-group{display:grid;grid-template-columns:112px minmax(0,1fr);gap:10px;padding:8px 7px 6px;border-bottom:1px solid #8f949c}
  .transfer-group:last-child{border-bottom:none}
  .transfer-group-name{font-size:12px;font-weight:800;text-decoration:underline;text-underline-offset:3px;padding-top:5px;color:#30343a}
  .transfer-field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px}
  .transfer-sheet-row{display:grid;grid-template-columns:minmax(145px,1.55fr) minmax(82px,.8fr) 38px;gap:7px;align-items:center;min-height:34px;padding:4px 5px;border-radius:5px;border:1px solid transparent;scroll-margin-top:220px}
  .transfer-sheet-row:hover{background:#f7f8fa}
  .transfer-sheet-row.active{border-color:#a84aa7;background:#faf1fa;box-shadow:inset 3px 0 0 #a84aa7}
  .transfer-sheet-row.unfilled{background:#fff8df}
  .transfer-sheet-row.excluded{background:#eef0f2;color:#777}
  .transfer-sheet-label{font-size:12px;line-height:1.35;word-break:break-word}
  .transfer-sheet-value{min-height:25px;display:flex;align-items:center;justify-content:center;padding:3px 7px;border-bottom:1px dotted #666;font-size:13px;font-weight:800;text-align:center;word-break:break-word}
  .transfer-sheet-value.empty{color:#9a3a32;border:1px solid #e2b24e;background:#fff3c4;border-radius:4px}
  .transfer-sheet-value.excluded{color:#777;border-bottom-color:#aaa;font-weight:600}
  .transfer-copy-btn{border:1px solid #c4c9d1;background:#fff;border-radius:5px;padding:4px 5px;font-size:11px;color:#444}
  .transfer-copy-btn:disabled{background:#e1e4e8;color:#999;cursor:not-allowed}
  .transfer-footer-actions{width:min(1120px,100%);margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 0 18px}
  .transfer-footer-actions .spacer{flex:1}
  .shortcut{font-size:12px;color:var(--muted);line-height:1.7}
  .toast{position:fixed;right:18px;bottom:18px;z-index:100;background:#222;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}
  .toast.show{opacity:1;transform:none}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:90;display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
  .modal{width:min(620px,100%);max-height:calc(100vh - 24px);background:#fff;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);overflow:hidden;display:flex;flex-direction:column}
  .modal-head{padding:14px 16px;background:var(--accent-soft);font-weight:800;border-bottom:1px solid var(--line);flex:0 0 auto}
  .modal-body{padding:16px;overflow:auto;min-height:0}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex:0 0 auto;background:#fff}
  .modal.import-result-modal{width:min(1180px,100%)}
  .modal.import-result-modal .modal-body{padding:12px 16px}
  .modal.import-result-modal .import-detail-wrap{max-height:38vh}
  .modal.import-result-modal .warning-list{max-height:22vh}
  .file-input{display:none}
  .small-note{font-size:12px;color:var(--muted)}

  .import-panel{margin-bottom:14px;border:2px solid #d9bdd9;background:linear-gradient(180deg,#fff,#fcf7fc)}
  .import-steps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .import-step{border:1px solid var(--line);border-radius:10px;padding:14px;background:#fff}
  .import-step-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .step-circle{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;border-radius:50%;background:var(--accent);color:#fff;font-weight:800}
  .import-step-title{font-weight:800;font-size:16px}
  .import-result{margin-top:10px;border-top:1px solid #eee;padding-top:10px;font-size:12px;color:#4b5563;line-height:1.6}
  .import-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .mini-badge{display:inline-flex;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:700;background:#eef1f5;color:#4b5563}
  .mini-badge.ok{background:#e7f6ee;color:#14613e}.mini-badge.warn{background:#fff4d6;color:#7a5400}.mini-badge.danger{background:#fff1f0;color:#9d2118}
  .field-source{display:inline-flex;align-items:center;margin-left:7px;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:800;vertical-align:middle}
  .field-source.base{background:#e8f3ff;color:#145b91}.field-source.auto{background:#e7f6ee;color:#14613e}.field-source.rule{background:#f0f1f3;color:#4b5563}.field-source.derived{background:#eee9fb;color:#5e3b91}.field-source.manual{background:#fff4d6;color:#7a5400}
  .source-detail{display:block;font-size:10px;color:#7a7f88;font-weight:400;margin-top:3px;white-space:normal}
  .busy-box{padding:24px;text-align:center}.spinner{width:34px;height:34px;border:4px solid #eee;border-top-color:var(--accent);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  .import-summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.import-summary-item{border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}.import-summary-item b{display:block;font-size:22px}
  .warning-list{max-height:220px;overflow:auto;border:1px solid #eee;border-radius:7px;padding:8px 12px;background:#fafafa;font-size:12px;line-height:1.6}
  .import-detail-wrap{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px}
  .import-detail-table{width:100%;border-collapse:collapse;font-size:11px;white-space:nowrap}
  .import-detail-table th,.import-detail-table td{padding:6px 8px;border-bottom:1px solid #eceff3;text-align:right}
  .import-detail-table th:first-child,.import-detail-table td:first-child,.import-detail-table th:nth-child(2),.import-detail-table td:nth-child(2),.import-detail-table th:nth-child(3),.import-detail-table td:nth-child(3){text-align:left}
  .import-detail-table thead th{position:sticky;top:0;background:#f5f7fa;z-index:1}
  .match-note{margin-top:8px;padding:8px 10px;border-radius:7px;background:#f6f8fb;font-size:12px;line-height:1.55}

  @media(max-width:1500px){
    .header-main{flex-wrap:wrap}
    .header-actions{flex-basis:100%;justify-content:flex-end;border-top:1px solid rgba(255,255,255,.22);padding-top:8px}
    .patient-sticky{top:116px}
  }
  @media(max-width:900px){
    .summary-cards{grid-template-columns:repeat(2,1fr)}
    .import-steps{grid-template-columns:1fr}
    .import-summary-grid{grid-template-columns:1fr 1fr}
    .backup-status-box{order:3;width:100%;max-width:none}
    .field-row{grid-template-columns:1fr;gap:6px}
    .field-row .copy-btn{justify-self:start}
    .transfer-view{grid-template-columns:1fr}
    .transfer-side{position:static}
    .patient-sticky{top:58px}
  }

  @media(max-width:900px){
    .transfer-sheet{padding:18px 14px}
    .transfer-document-head{grid-template-columns:1fr}
    .transfer-document-title,.transfer-document-id{text-align:left}
    .transfer-group{grid-template-columns:1fr}
    .transfer-group-name{padding-top:0}
    .transfer-field-grid{grid-template-columns:1fr}
  }

  .datetime-edit-grid{display:grid;gap:12px}
  .datetime-edit-row{display:grid;grid-template-columns:110px minmax(180px,1fr) minmax(130px,.65fr);gap:10px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fafafa}
  .datetime-edit-name{font-weight:800;align-self:center}
  .datetime-edit-field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .datetime-edit-field input{width:100%}
  .datetime-edit-note{margin-top:12px;padding:10px 12px;border-radius:8px;background:#fff8df;border:1px solid #ead68c;font-size:13px;line-height:1.6}
  @media(max-width:700px){.datetime-edit-row{grid-template-columns:1fr}.datetime-edit-name{margin-bottom:-2px}.partial-date-control{grid-template-columns:1fr}.partial-date-control .partial-date-text,.partial-date-control .partial-date-note{grid-column:1}}

  @media print{
    .app-header,.patient-sticky,.editor-actions,.copy-btn,.toast{display:none!important}
    .editor-sticky-stack{position:static!important;padding:0!important;background:none!important}
    body{background:#fff}
    .main{max-width:none;padding:0}
    .form-card{box-shadow:none;border:none}
    .field-row{break-inside:avoid}
  }
</style>
</head>
<body>
<header class="app-header">
  <div class="header-main">
    <div>
      <div class="app-title">CTGS 手入力・転記支援アプリ</div>
      <div class="app-sub">v1.1.0 - 現行仕様専用リファクタリング版／旧データ・旧導線を廃止</div>
    </div>
    <div class="header-spacer"></div>
    <div class="security-badge">外部通信なし / JSONバックアップ</div>
    <div class="backup-status-box" title="ブラウザの×で閉じた場合、未バックアップの変更は保存されません">
      <div class="backup-state" id="backupStateText">未バックアップ</div>
      <div class="backup-folder" id="backupFolderText">保存先：未設定</div>
    </div>
    <div class="header-actions">
      <button class="btn small primary" id="openImportBtn">データ取込</button>
      <button class="btn small" id="exportJsonBtn">バックアップ保存</button>
      <button class="btn small" id="restoreLatestBtn">復元</button>
      <button class="btn small" id="importJsonBtn">指定して復元</button>
      <button class="btn small" id="backupFolderBtn">保存先設定</button>
      <button class="btn small" id="exportCsvBtn">CSV出力</button>
      <button class="btn small ok" id="backupExitBtn">バックアップして終了</button>
      <button class="btn small danger" id="resetBtn">全消去</button>
      <input class="file-input" type="file" id="importFile" accept=".json,application/json">
      <input class="file-input" type="file" id="targetCsvFile" accept=".csv,text/csv">
      <input class="file-input" type="file" id="relatedZipFile" accept=".zip,application/zip">
      <input class="file-input" type="file" id="singleDiffZipFile" accept=".zip,application/zip">
      <input class="file-input" type="file" id="bulkDiffZipFile" accept=".zip,application/zip">
    </div>
  </div>
</header>
<main class="main" id="app"></main>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>
<datalist id="deptList"></datalist>
<datalist id="doctorList"></datalist>

function newPatient(){
  const now=new Date().toISOString();
  const patient={
    id:uuid(),createdAt:now,updatedAt:now,
    manualComplete:false,transferDone:false,
    fields:{},fieldMeta:{},manualLocks:{},internalTiming:{},internalLabResults:{}
  };
  ensureSystemFields(patient);

function applyDerivedFields(patient){
  patient.fields=patient.fields||{};
  patient.fieldMeta=patient.fieldMeta||{};
  patient.manualLocks=patient.manualLocks||{};
  patient.internalTiming=patient.internalTiming||{};
  patient.internalLabResults=patient.internalLabResults||{};
  const now=new Date().toISOString();
  if(valueIsFilled(patient.fields.dataId)){
    patient.fields.chartNo=chartNoFromDataId(patient.fields.dataId);
    patient.fieldMeta.chartNo={mode:'derived',source:'識別番号',detail:'識別番号の中央6桁を逆順に変換',at:now};
  }
  const codeFromName=departmentCodeFromName(patient.fields.departmentName);
  if(codeFromName){
    patient.fields.departmentCode=codeFromName;
    patient.fieldMeta.departmentCode={mode:'derived',source:'診療科',detail:`${patient.fields.departmentName} → ${codeFromName}`,at:now};
  }
  if(DEPARTMENT_MAP[patient.fields.departmentCode]){
    patient.fields.departmentName=DEPARTMENT_MAP[patient.fields.departmentCode];
    if(!codeFromName)patient.fieldMeta.departmentName={mode:'derived',source:'診療科コード',detail:`${patient.fields.departmentCode} → ${patient.fields.departmentName}`,at:now};
  }

}
function updateField(patient,key,value,source){
  markManual(patient,key);
  if(key==='dataId'){
    value=normalizeDataId(value);
    if(source&&source.value!==value)source.value=value;
    patient.fields.dataId=value;
    patient.fields.chartNo=chartNoFromDataId(value);
    patient.fieldMeta.chartNo={mode:'derived',source:'識別番号',detail:'中央6桁を逆順に変換',at:new Date().toISOString()};
    const chartInput=document.querySelector('[data-key="chartNo"]');
    if(chartInput)chartInput.value=patient.fields.chartNo;
  }else if(key==='departmentCode'){
    patient.fields.departmentCode=value;
    patient.fields.departmentName=DEPARTMENT_MAP[value]||'';
    patient.fieldMeta.departmentName={mode:'derived',source:'診療科コード',detail:value?`${value} → ${patient.fields.departmentName}`:'',at:new Date().toISOString()};
    const deptInput=document.querySelector('[data-key="departmentName"]');
    if(deptInput)deptInput.value=patient.fields.departmentName;
  }else if(!normalizeManualOcclusionSites(patient,key,value)){
    patient.fields[key]=value;
  }
  const dependencyParentChanged=DEPENDENCY_PARENT_KEYS.has(key);
  if(dependencyParentChanged)clearDisabledDependentValues(patient);
  if(key==='patientCode'||key==='admissionDate')assignSameDayAdmissionNumbers(state.patients);
  patient.updatedAt=new Date().toISOString();
  if(key==='primaryDisease'||dependencyParentChanged||OCCLUSION_SITE_KEYS.includes(key)){
    saveState(true);
    if(key==='primaryDisease')activeTab='basic';
    render();
    return;
  }
  saveState();
  updateHeaderProgress();
  refreshFieldMissingUi(patient,key);
}

function hydrateCurrentState(parsed){
  if(!validBackupObject(parsed))throw new Error('この版で作成した現行形式のCTGSバックアップではありません。旧版JSONは読み込めません。');
  const next={...defaultState(),...deepClone(parsed),appId:APP_ID,schemaVersion:DATA_SCHEMA_VERSION,version:APP_VERSION,currentPatientId:null};
  next.importInfo=next.importInfo||{target:null,related:null};
  next.importHistory=Array.isArray(next.importHistory)?next.importHistory:[];
  next.patients.forEach(patient=>applyDerivedFields(patient));
  assignSameDayAdmissionNumbers(next.patients);
  return next;
}

function localDateText(value=new Date()){

function decodeCsvBufferInfo(buffer){

}

async function importRelatedZipInitial(file){

const BACKUP_DB_NAME='ctgs_backup_settings_v1';
const BACKUP_STORE_NAME='handles';
const BACKUP_HANDLE_KEY='backupDirectory';
const BACKUP_LATEST_NAME='CTGS作業バックアップ_latest.json';

function backupComparableObject(){
  const copy=JSON.parse(JSON.stringify(state));
  delete copy.currentPatientId;
  delete copy.updatedAt;
  delete copy.backupInfo;
  delete copy.backupDateTime;
  delete copy.backupType;
  copy.appId=APP_ID;
  copy.schemaVersion=DATA_SCHEMA_VERSION;
  copy.version=APP_VERSION;
  return copy;
}
function backupFingerprint(){return JSON.stringify(backupComparableObject());}
function hasUnsavedChanges(){return backupFingerprint()!==lastBackupFingerprint;}
function formatBackupClock(iso){
  if(!iso)return '';
  const d=new Date(iso);if(Number.isNaN(d.getTime()))return '';
  return d.toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function updateBackupUi(){
  const stateEl=document.getElementById('backupStateText');
  const folderEl=document.getElementById('backupFolderText');
  if(stateEl){
    stateEl.classList.remove('dirty','saved','error');
    if(backupUiError){stateEl.textContent='保存エラー';stateEl.classList.add('error');stateEl.title=backupUiError;}
    else if(hasUnsavedChanges()){
      stateEl.textContent='● 未保存の変更あり';stateEl.classList.add('dirty');stateEl.title='ブラウザの×で閉じると、この変更は保存されません';
    }else if(hasFormalBackup){
      stateEl.textContent=`● バックアップ済み${lastBackupAt?` ${new Date(lastBackupAt).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`:''}`;stateEl.classList.add('saved');stateEl.title='JSONバックアップに保存済みです';
    }else{stateEl.textContent='● 未バックアップ';stateEl.title='まだ正式なJSONバックアップは作成されていません';}
  }
  if(folderEl){folderEl.textContent=`保存先：${backupDirectoryName||'未設定'}`;folderEl.title=backupDirectoryName||'「保存先設定」でバックアップフォルダを選択してください';}
}
function markBackupCompleted(iso){
  hasFormalBackup=true;lastBackupAt=iso||new Date().toISOString();lastBackupFingerprint=backupFingerprint();backupUiError='';updateBackupUi();
}
function openBackupDb(){
  return new Promise((resolve,reject)=>{
    if(!('indexedDB' in window)){reject(new Error('IndexedDBを利用できません'));return;}
    const req=indexedDB.open(BACKUP_DB_NAME,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(BACKUP_STORE_NAME))db.createObjectStore(BACKUP_STORE_NAME);};
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('保存先設定を開けません'));
  });
}
async function readStoredDirectoryHandle(){
  try{const db=await openBackupDb();return await new Promise((resolve,reject)=>{const tx=db.transaction(BACKUP_STORE_NAME,'readonly');const req=tx.objectStore(BACKUP_STORE_NAME).get(BACKUP_HANDLE_KEY);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);});}catch(e){console.warn(e);return null;}
}
async function storeDirectoryHandle(handle){
  const db=await openBackupDb();await new Promise((resolve,reject)=>{const tx=db.transaction(BACKUP_STORE_NAME,'readwrite');tx.objectStore(BACKUP_STORE_NAME).put(handle,BACKUP_HANDLE_KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});
}
async function directoryPermission(handle,mode='readwrite',request=false){
  if(!handle)return false;
  const opts={mode};
  if(typeof handle.queryPermission==='function'){
    const q=await handle.queryPermission(opts);if(q==='granted')return true;if(q==='denied'&&!request)return false;
  }
  if(request&&typeof handle.requestPermission==='function')return (await handle.requestPermission(opts))==='granted';
  return false;
}
async function initializeBackupDirectory(){
  if(!('showDirectoryPicker' in window)){backupDirectoryName='フォルダ自動保存非対応';updateBackupUi();return;}
  backupDirectoryHandle=await readStoredDirectoryHandle();
  if(backupDirectoryHandle){backupDirectoryName=backupDirectoryHandle.name||'設定済みフォルダ';}
  updateBackupUi();
}
async function chooseBackupDirectory(){
  if(!('showDirectoryPicker' in window)){
    alert('この環境では保存先フォルダを直接指定できません。バックアップは通常のダウンロードとして出力し、「指定して復元」から読み込んでください。');return null;
  }
  try{
    const handle=await window.showDirectoryPicker({id:'ctgs-backup-folder',mode:'readwrite',startIn:'downloads'});
    if(!(await directoryPermission(handle,'readwrite',true)))throw new Error('フォルダへの書込が許可されませんでした');
    backupDirectoryHandle=handle;backupDirectoryName=handle.name||'設定済みフォルダ';await storeDirectoryHandle(handle);backupUiError='';updateBackupUi();showToast(`保存先を「${backupDirectoryName}」に設定しました`);return handle;
  }catch(e){if(e?.name!=='AbortError'){backupUiError=e.message;updateBackupUi();alert('保存先を設定できませんでした。\n'+e.message);}return null;}
}
async function ensureBackupDirectory(mode='readwrite',promptIfMissing=true){
  if(!('showDirectoryPicker' in window))return null;
  if(!backupDirectoryHandle)backupDirectoryHandle=await readStoredDirectoryHandle();
  if(backupDirectoryHandle){
    backupDirectoryName=backupDirectoryHandle.name||'設定済みフォルダ';
    if(await directoryPermission(backupDirectoryHandle,mode,true)){updateBackupUi();return backupDirectoryHandle;}
  }
  return promptIfMissing?await chooseBackupDirectory():null;
}
async function writeTextToDirectory(dir,filename,text){
  const fileHandle=await dir.getFileHandle(filename,{create:true});const writable=await fileHandle.createWritable();await writable.write(text);await writable.close();return filename;
}
function buildBackupPayload(type){
  const now=new Date().toISOString();
  state.updatedAt=now;
  return {
    ...deepClone(state),
    appId:APP_ID,
    schemaVersion:DATA_SCHEMA_VERSION,
    version:APP_VERSION,
    currentPatientId:null,
    backupDateTime:now,
    backupType:type,
    backupInfo:{backupDateTime:now,appVersion:APP_VERSION,schemaVersion:DATA_SCHEMA_VERSION,backupType:type,caseCount:state.patients.length}
  };
}
function backupFilename(type,stamp){
  const labels={manual:'CTGS作業バックアップ',exit:'CTGS終了バックアップ',beforeRestore:'CTGS復元前バックアップ',beforeImport:'CTGS差分取込前バックアップ'};
  return `${labels[type]||'CTGSバックアップ'}_${stamp}.json`;
}
async function saveBackup(type='manual',{markSaved=true,promptForDirectory=true}={}){
  const payload=buildBackupPayload(type);const json=JSON.stringify(payload,null,2);const datedName=backupFilename(type,timestamp());
  try{
    const dir=await ensureBackupDirectory('readwrite',promptForDirectory);
    if(dir){
      await writeTextToDirectory(dir,datedName,json);
      if(type==='manual'||type==='exit')await writeTextToDirectory(dir,BACKUP_LATEST_NAME,json);
      if(markSaved)markBackupCompleted(payload.backupDateTime);
      return {ok:true,method:'directory',filename:datedName,folder:backupDirectoryName,payload};
    }
    if(promptForDirectory){
      downloadBlob(json,'application/json;charset=utf-8',datedName);
      if(markSaved)markBackupCompleted(payload.backupDateTime);
      return {ok:true,method:'download',filename:datedName,folder:'ダウンロード',payload};
    }
    return {ok:false,cancelled:true};
  }catch(e){backupUiError=e.message;updateBackupUi();alert('バックアップを保存できませんでした。\n'+e.message);return {ok:false,error:e};}
}
async function exportJson(){
  const result=await saveBackup('manual',{markSaved:true,promptForDirectory:true});
  if(result.ok)showToast(result.method==='directory'?'バックアップを保存しました':'バックアップのダウンロードを開始しました');
}
function validBackupObject(parsed){
  return !!parsed
    && parsed.appId===APP_ID
    && parsed.schemaVersion===DATA_SCHEMA_VERSION
    && Array.isArray(parsed.patients);
}
function backupDateFromObject(parsed,file){
  const raw=parsed?.backupInfo?.backupDateTime||parsed?.backupDateTime||parsed?.updatedAt;
  const t=Date.parse(raw||'');return Number.isFinite(t)?t:(file?.lastModified||0);
}
async function findLatestBackup(dir){
  const candidates=[];const invalid=[];
  for await(const [name,handle] of dir.entries()){
    if(handle.kind!=='file'||!/\.json$/i.test(name)||!/^CTGS/i.test(name))continue;
    try{const file=await handle.getFile();const parsed=JSON.parse(await file.text());if(!validBackupObject(parsed)){invalid.push(name);continue;}candidates.push({name,parsed,time:backupDateFromObject(parsed,file)});}catch(e){invalid.push(name);}
  }
  candidates.sort((a,b)=>b.time-a.time);
  return {latest:candidates[0]||null,invalid};
}
async function createBeforeRestoreBackup(){
  if(!state.patients.length&&!hasUnsavedChanges())return {ok:true,skipped:true};
  const dir=await ensureBackupDirectory('readwrite',false);if(!dir)return {ok:false,skipped:true};
  return await saveBackup('beforeRestore',{markSaved:false,promptForDirectory:false});
}
function describeBackup(parsed,name){
  const iso=parsed?.backupInfo?.backupDateTime||parsed?.backupDateTime||parsed?.updatedAt||'';
  const version=parsed?.backupInfo?.appVersion||parsed?.version||'不明';
  return `ファイル：${name}\n保存日時：${formatBackupClock(iso)||'不明'}\n症例数：${parsed.patients.length}件\nアプリ版：${version}`;
}
async function applyRestoredBackup(parsed,name){
  if(!validBackupObject(parsed))throw new Error('この版で作成した現行形式のCTGSバックアップではありません。旧版JSONは読み込めません。');
  const before=await createBeforeRestoreBackup();
  const warning=before.ok&&!before.skipped?'\n\n現在の状態は「復元前バックアップ」として保存します。':before.skipped&&!before.ok?'\n\n※現在の状態の復元前バックアップは作成できません。':'';
  if(!confirm(`${describeBackup(parsed,name)}${warning}\n\n現在のデータを置き換えて復元しますか？`))return false;
  state=hydrateCurrentState(parsed);
  saveState(true);
  hasFormalBackup=true;
  lastBackupAt=parsed.backupInfo?.backupDateTime||parsed.backupDateTime||parsed.updatedAt||new Date().toISOString();
  lastBackupFingerprint=backupFingerprint();
  backupUiError='';currentMode='edit';activeTab='basic';
  render();updateBackupUi();showToast('復元しました');
  return true;
}
async function restoreLatestBackup(){
  const dir=await ensureBackupDirectory('readwrite',true);if(!dir)return;
  try{
    const {latest,invalid}=await findLatestBackup(dir);
    if(!latest){alert(`保存先「${backupDirectoryName}」に復元可能なCTGSバックアップJSONがありません。${invalid.length?`\n読込できないJSON：${invalid.length}件`:''}`);return;}
    await applyRestoredBackup(latest.parsed,latest.name);
  }catch(e){alert('最新バックアップを復元できませんでした。\n'+e.message);}
}
function importJsonFile(file){
  const reader=new FileReader();reader.onload=async()=>{try{const parsed=JSON.parse(reader.result);await applyRestoredBackup(parsed,file.name);}catch(e){alert('復元できませんでした。CTGS入力支援アプリのJSONか確認してください。\n'+e.message);}};reader.readAsText(file,'UTF-8');
}
async function backupAndExit(){
  const result=await saveBackup('exit',{markSaved:true,promptForDirectory:true});if(!result.ok)return;
  const app=document.getElementById('app');
  app.innerHTML=`<div class="exit-screen"><div class="exit-card"><h2>バックアップが完了しました</h2><p>現在の作業内容をJSONに保存しました。</p><div class="saved-file">${escapeHtml(result.folder)} / ${escapeHtml(result.filename)}</div><p><strong>この画面は終了済みです。</strong><br>ウィンドウまたはタブの「×」で閉じてください。</p><div class="backup-help">通常のブラウザタブは、アプリ側から自動で閉じられない場合があります。<br>この画面では追加の入力操作はできません。</div></div></div>`;
  document.querySelectorAll('.header-actions button').forEach(b=>b.disabled=true);updateBackupUi();
  try{window.close();}catch(e){}
}

// ヘッダー操作
 document.getElementById('openImportBtn').onclick=()=>{state.currentPatientId=null;currentMode='edit';render();setTimeout(()=>document.getElementById('importPanel')?.scrollIntoView({behavior:'smooth',block:'start'}),0);};

 document.getElementById('exportJsonBtn').onclick=exportJson;
 document.getElementById('restoreLatestBtn').onclick=restoreLatestBackup;
 document.getElementById('importJsonBtn').onclick=()=>document.getElementById('importFile').click();
 document.getElementById('importFile').onchange=e=>{if(e.target.files[0])importJsonFile(e.target.files[0]);e.target.value='';};
 document.getElementById('backupFolderBtn').onclick=chooseBackupDirectory;
 document.getElementById('exportCsvBtn').onclick=exportCsv;
 document.getElementById('backupExitBtn').onclick=backupAndExit;
 document.getElementById('resetBtn').onclick=resetAll;

window.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();exportJson();return;}
  if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();navigatePatient(-1);return;}
  if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();navigatePatient(1);return;}
  if(currentMode==='transfer'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
    if(e.key==='Enter'){e.preventDefault();stepTransfer(e.shiftKey?-1:1,transferFieldsForPatient(getCurrentPatient()).length);}
    if(e.key.toLowerCase()==='c'){e.preventDefault();const p=getCurrentPatient();const fs=transferFieldsForPatient(p);const f=fs[transferIndex];if(f){const v=formatFieldValue(f,p.fields[f.key]);navigator.clipboard.writeText(v).then(()=>showToast('コピーしました')).catch(()=>fallbackCopy(v));}}
  }
});

if('ResizeObserver' in window){
  const headerObserver=new ResizeObserver(syncStickyOffsets);
  const header=document.querySelector('.app-header');

}
lastBackupFingerprint=backupFingerprint();

render();
updateBackupUi();
initializeBackupDirectory();
